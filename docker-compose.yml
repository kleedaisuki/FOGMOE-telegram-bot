services:
  # This is deliberately the unprivileged Bot client only.  Do not add wspctld here:
  # the broker needs host systemd cgroup delegation and must remain a root-owned host service.
  bot:
    build:
      context: .
      dockerfile: Dockerfile
    image: fogmoe-telegram-bot:latest
    init: true
    # UID/GID 65532 is the fixed identity authorized by the host broker's SO_PEERCRED policy.
    # The broker owns the socket but chowns it to this UID and uses mode 0600; do not weaken it
    # into a broad group or world ACL merely to make a container connect.
    user: "65532:65532"
    read_only: true
    privileged: false
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 512
    # 配置含有密钥；由操作者在仓库根目录维护，绝不烘焙进镜像。
    # 开发态 host socket 只来自仓库相邻、被 .gitignore 排除的 .wspctl/run/bot；
    # operator socket 位于不可挂载给 Bot 的 sibling ``run/operator``。以只读目录 bind mount
    # 仍允许 connect(2)，但阻止 Bot 替换 socket 或创建相邻目录项。
    # Production operators may replace source with a separately provisioned absolute directory,
    # but must keep it out of the container except for this read-only socket view.
    volumes:
      - type: bind
        source: ./config.json
        target: /app/config.json
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./.wspctl/run/bot
        target: /app/.wspctl/run/bot
        read_only: true
        bind:
          create_host_path: false
      - type: volume
        source: fogmoe-runtime
        target: /app/logs
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m,mode=1777
    # Bot 配置在输入边界限制 grace<=190s；Compose 再保留至少 10s 后升级为 SIGKILL。
    stop_grace_period: 200s
    restart: unless-stopped

volumes:
  fogmoe-runtime:

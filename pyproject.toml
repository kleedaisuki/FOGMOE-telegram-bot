[build-system]
requires = ["scikit-build-core>=0.11", "pybind11>=3,<4"]
build-backend = "scikit_build_core.build"

[project]
name = "fogmoe-telegram-bot"
version = "0.1.0"
description = "FogMoe Telegram bot"
readme = "README.md"
requires-python = ">=3.14"
license = { text = "AGPL-3.0-or-later" }
dependencies = [
    "python-telegram-bot[socks]",
    "SQLAlchemy>=2.0",
    "asyncpg",
    "alembic",
    "pydantic>=2.12,<3",
    "binance-futures-connector",
    "aiohttp",
    "aiohttp-socks>=0.10",
    "requests[socks]",
    "telegramify-markdown",
    "rich>=14.1",
    "tzdata>=2026.1",
]

[project.optional-dependencies]
dashboard-gui = [
    "PyQt6>=6.10.1",
    "matplotlib>=3.10.7",
]
dev = [
    "pytest>=8",
    "mypy>=1.18",
    "pyright>=1.1.411",
    "ruff>=0.12",
    "PyQt6>=6.10.1",
    "matplotlib>=3.10.7",
]

[tool.mypy]
python_version = "3.14"
strict = true
packages = ["fogmoe_bot", "fogmoe_config", "fogmoe_dashboard", "fogmoe_dbctl", "wspctl"]
exclude = ["^tests/"]
warn_unreachable = true
show_error_codes = true

[tool.pyright]
include = [
    "src/fogmoe_bot",
    "src/fogmoe_config",
    "src/fogmoe_dashboard",
    "src/fogmoe_dbctl",
    "src/wspctl",
]
pythonVersion = "3.14"
venvPath = "."
venv = ".venv"

[project.scripts]
fogmoe-bot = "fogmoe_bot.main:main"
fogmoe-dashboard = "fogmoe_dashboard.presentation.cli:main"
fogmoe-dashboard-gui = "fogmoe_dashboard.presentation.gui.app:main"
fogmoe-dbctl = "fogmoe_dbctl.cli:main"

[tool.scikit-build]
minimum-version = "build-system.requires"
cmake.version = ">=3.28"
ninja.version = ">=1.11"
cmake.define = { BUILD_TESTING = "OFF", WSPCTL_BUILD_TESTING = "OFF", WSPCTL_BUILD_HOST_PUBLISHER = "OFF", WSPCTL_BUILD_HOST_RUNTIME = "OFF", WSPCTL_BUILD_WORKSPACE_SUPERVISOR = "OFF" }
wheel.packages = [
    "src/fogmoe_bot",
    "src/fogmoe_config",
    "src/fogmoe_dashboard",
    "src/fogmoe_dbctl",
]
wheel.exclude = [
    "fogmoe_config/CMakeLists.txt",
    "fogmoe_config/include/**",
    "fogmoe_config/src/**",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pybind11>=3,<4",
    "scikit-build-core>=0.11",
]
